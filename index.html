<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Scanner CODE 128</title>

  <script src="https://cdn.jsdelivr.net/npm/@ericblade/quagga2/dist/quagga.min.js"></script>

  <style>
    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: #111;
      color: white;
      font-family: Arial, sans-serif;
    }

    body {
      display: flex;
      flex-direction: column;
    }

    #status {
      padding: 18px;
      text-align: center;
      font-size: 18px;
      font-weight: bold;
    }

    #scanner {
      position: relative;
      flex: 1;
      min-height: 400px;
      background: black;
      overflow: hidden;
    }

    #scanner video,
    #scanner canvas {
      width: 100% !important;
      height: 100% !important;
      object-fit: cover;
    }

    .cadre {
      position: absolute;
      z-index: 10;

      left: 7%;
      right: 7%;
      top: 50%;

      height: 160px;

      transform: translateY(-50%);

      border: 3px solid white;
      border-radius: 12px;

      pointer-events: none;
    }

    .ligne {
      position: absolute;

      left: 5%;
      right: 5%;
      top: 50%;

      height: 3px;

      background: red;
    }
  </style>

</head>

<body>

  <div id="status">
    JavaScript en attente...
  </div>

  <div id="scanner">

    <div class="cadre">
      <div class="ligne"></div>
    </div>

  </div>


  <script>

    const status =
      document.getElementById("status");


    status.textContent =
      "JavaScript OK";


    if (
      typeof Quagga === "undefined"
    ) {

      status.textContent =
        "ERREUR : Quagga non charge";

    } else {

      status.textContent =
        "Quagga charge. Demarrage camera...";


      Quagga.init(
        {

          inputStream: {

            type:
              "LiveStream",

            target:
              document.querySelector(
                "#scanner"
              ),

            constraints: {

              facingMode:
                "environment"

            }

          },


          decoder: {

            readers: [
              "code_128_reader"
            ]

          },


          locate:
            true,


          locator: {

            patchSize:
              "medium",

            halfSample:
              true

          }

        },


        function(error) {

          if (error) {

            status.textContent =
              "ERREUR CAMERA : " +
              (
                error.name ||
                error.message ||
                String(error)
              );

            console.error(error);

            return;
          }


          status.textContent =
            "Camera OK - presentez le CODE 128";


          Quagga.start();

        }

      );


      Quagga.onDetected(
        function(result) {

          if (
            result &&
            result.codeResult &&
            result.codeResult.code
          ) {

            const code =
              result.codeResult.code;


            status.textContent =
              "CODE DETECTE : " +
              code;


            try {
              Quagga.stop();
            } catch (e) {
            }

          }

        }
      );

    }

  </script>

</body>

</html>
